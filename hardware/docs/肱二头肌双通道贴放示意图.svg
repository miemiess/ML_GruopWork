<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect width="1200" height="880" fill="#ffffff"/>

  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">肱二头肌疲劳测试 · 双导联板贴放与接线示意（右臂）</text>

  <!-- ================= 左：贴放位置 ================= -->
  <text x="20" y="70" font-size="16" font-weight="bold" fill="#1f5fa8">① 贴放位置（右臂前视，掌心朝前）</text>

  <!-- 上臂轮廓 -->
  <path d="M190 110 Q280 70 370 110 Q385 400 355 700 L205 700 Q175 400 190 110 Z" fill="#f6dccb" stroke="#c9a48c" stroke-width="2"/>
  <!-- 肱二头肌两头 -->
  <ellipse cx="248" cy="380" rx="42" ry="215" fill="#e59a8c" stroke="#c0675a" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="312" cy="390" rx="40" ry="205" fill="#eaa799" stroke="#c0675a" stroke-width="1.5" opacity="0.9"/>
  <path d="M258 585 L280 650 L302 585 Z" fill="#e8e0d0" stroke="#b9ab90" stroke-width="1.5"/>

  <!-- 神经支配区 -->
  <rect x="200" y="300" width="160" height="65" fill="#d9534f" opacity="0.18" stroke="#d9534f" stroke-dasharray="5 4"/>
  <line x1="150" y1="333" x2="200" y2="333" stroke="#d9534f" stroke-width="1.5"/>
  <text x="145" y="328" text-anchor="end" font-size="14" fill="#c9302c">神经支配区</text>
  <text x="145" y="347" text-anchor="end" font-size="12" fill="#c9302c">（肌腹中部，避开）</text>

  <!-- 肩峰—肘窝连线 -->
  <line x1="280" y1="100" x2="280" y2="650" stroke="#555" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="280" cy="100" r="5" fill="#333"/>
  <text x="292" y="105" font-size="13" fill="#333">肩峰（内侧）</text>
  <circle cx="280" cy="650" r="5" fill="#333"/>
  <text x="292" y="680" font-size="13" fill="#333">肘窝</text>

  <!-- 1/3 标尺 -->
  <line x1="470" y1="100" x2="470" y2="650" stroke="#1f5fa8" stroke-width="1.5"/>
  <line x1="462" y1="100" x2="478" y2="100" stroke="#1f5fa8" stroke-width="1.5"/>
  <line x1="462" y1="467" x2="478" y2="467" stroke="#1f5fa8" stroke-width="2.5"/>
  <line x1="462" y1="650" x2="478" y2="650" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="482" y="290" font-size="15" fill="#1f5fa8">2/3</text>
  <text x="482" y="565" font-size="15" font-weight="bold" fill="#1f5fa8">1/3</text>
  <line x1="378" y1="467" x2="462" y2="467" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="482" y="472" font-size="12" fill="#1f5fa8">← 电极中心</text>

  <!-- 肌肉标注 -->
  <text x="60" y="215" font-size="14" fill="#333">肱二头肌长头</text>
  <text x="60" y="234" font-size="12" fill="#666">（外侧）→ CH1</text>
  <line x1="150" y1="228" x2="224" y2="252" stroke="#666" stroke-width="1"/>
  <text x="400" y="185" font-size="14" fill="#333">肱二头肌短头</text>
  <text x="400" y="204" font-size="12" fill="#666">（内侧）→ CH2</text>
  <line x1="420" y1="210" x2="336" y2="245" stroke="#666" stroke-width="1"/>

  <!-- 导联板 1（长头） -->
  <text x="240" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">CH1</text>
  <rect x="218" y="407" width="44" height="120" rx="5" fill="#222"/>
  <rect x="225" y="414" width="30" height="26" rx="2" fill="#d9a441"/>
  <rect x="225" y="454" width="30" height="26" rx="2" fill="#d9a441"/>
  <rect x="225" y="494" width="30" height="26" rx="2" fill="#d9a441"/>
  <text x="212" y="432" text-anchor="end" font-size="12" font-weight="bold" fill="#222">P</text>
  <text x="212" y="472" text-anchor="end" font-size="11" fill="#1f5fa8">RLD</text>
  <text x="212" y="512" text-anchor="end" font-size="12" font-weight="bold" fill="#222">N</text>

  <!-- 导联板 2（短头） -->
  <text x="320" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">CH2</text>
  <rect x="298" y="407" width="44" height="120" rx="5" fill="#222"/>
  <rect x="305" y="414" width="30" height="26" rx="2" fill="#d9a441"/>
  <rect x="305" y="454" width="30" height="26" rx="2" fill="#d9a441"/>
  <rect x="305" y="494" width="30" height="26" rx="2" fill="#d9a441"/>
  <text x="348" y="432" font-size="12" font-weight="bold" fill="#222">P</text>
  <text x="348" y="472" font-size="11" fill="#1f5fa8">RLD</text>
  <text x="348" y="512" font-size="12" font-weight="bold" fill="#222">N</text>

  <!-- 导联线 -->
  <path d="M240 527 Q236 610 222 700" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M320 527 Q324 610 338 700" fill="none" stroke="#222" stroke-width="3"/>

  <text x="150" y="730" text-anchor="middle" font-size="13" fill="#666">← 外侧（远离躯干）</text>
  <text x="420" y="730" text-anchor="middle" font-size="13" fill="#666">内侧（靠近躯干）→</text>

  <!-- 分隔线 -->
  <line x1="590" y1="55" x2="590" y2="740" stroke="#ddd" stroke-width="1.5"/>

  <!-- ================= 右：接线 ================= -->
  <text x="610" y="70" font-size="16" font-weight="bold" fill="#1f5fa8">② 接线（与厂家示意图一致）</text>

  <!-- 导联板 1 -->
  <text x="640" y="108" font-size="14" font-weight="bold" fill="#222">导联板 1 → CH1（长头）</text>
  <text x="669" y="129" text-anchor="middle" font-size="11" fill="#444">IN-N</text>
  <text x="725" y="129" text-anchor="middle" font-size="11" fill="#1f5fa8">RLD</text>
  <text x="781" y="129" text-anchor="middle" font-size="11" fill="#444">IN-P</text>
  <rect x="640" y="135" width="170" height="50" rx="6" fill="#222"/>
  <rect x="652" y="143" width="34" height="34" rx="3" fill="#d9a441"/>
  <rect x="708" y="143" width="34" height="34" rx="3" fill="#d9a441"/>
  <rect x="764" y="143" width="34" height="34" rx="3" fill="#d9a441"/>
  <!-- 白：IN-P → IN1P -->
  <path d="M781 185 V210 H900" fill="none" stroke="#888" stroke-width="6" stroke-linejoin="round"/>
  <path d="M781 185 V210 H900" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <text x="908" y="215" font-size="14" fill="#222">白线 → <tspan font-weight="bold">IN1P</tspan></text>
  <!-- 蓝：RLD → RLDOUT -->
  <path d="M725 185 V240 H900" fill="none" stroke="#2f6fd6" stroke-width="4" stroke-linejoin="round"/>
  <text x="908" y="245" font-size="14" fill="#2f6fd6">蓝线 → <tspan font-weight="bold">RLDOUT</tspan></text>
  <!-- 红：IN-N → IN1N -->
  <path d="M669 185 V270 H900" fill="none" stroke="#d63b3b" stroke-width="4" stroke-linejoin="round"/>
  <text x="908" y="275" font-size="14" fill="#d63b3b">红线 → <tspan font-weight="bold">IN1N</tspan></text>

  <!-- 导联板 2 -->
  <text x="640" y="338" font-size="14" font-weight="bold" fill="#222">导联板 2 → CH2（短头）</text>
  <text x="669" y="359" text-anchor="middle" font-size="11" fill="#444">IN-N</text>
  <text x="725" y="359" text-anchor="middle" font-size="11" fill="#1f5fa8">RLD</text>
  <text x="781" y="359" text-anchor="middle" font-size="11" fill="#444">IN-P</text>
  <rect x="640" y="365" width="170" height="50" rx="6" fill="#222"/>
  <rect x="652" y="373" width="34" height="34" rx="3" fill="#d9a441"/>
  <rect x="708" y="373" width="34" height="34" rx="3" fill="#d9a441"/>
  <rect x="764" y="373" width="34" height="34" rx="3" fill="#d9a441"/>
  <path d="M781 415 V440 H900" fill="none" stroke="#888" stroke-width="6" stroke-linejoin="round"/>
  <path d="M781 415 V440 H900" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <text x="908" y="445" font-size="14" fill="#222">白线 → <tspan font-weight="bold">IN2P</tspan></text>
  <path d="M725 415 V470 H900" fill="none" stroke="#2f6fd6" stroke-width="4" stroke-dasharray="7 5" stroke-linejoin="round"/>
  <text x="908" y="475" font-size="14" fill="#2f6fd6">蓝线 → 不接（悬空）</text>
  <text x="908" y="493" font-size="12" fill="#2f6fd6">可选：并到 RLDOUT</text>
  <path d="M669 415 V510 H900" fill="none" stroke="#d63b3b" stroke-width="4" stroke-linejoin="round"/>
  <text x="908" y="515" font-size="14" fill="#d63b3b">红线 → <tspan font-weight="bold">IN2N</tspan></text>

  <!-- 模块左排针 -->
  <rect x="1065" y="125" width="120" height="400" rx="6" fill="#1f7a3a"/>
  <g font-size="12" fill="#ffe27a" font-weight="bold">
    <circle cx="1080" cy="156" r="5" fill="#ccc"/><text x="1092" y="160">RLDOUT</text>
    <circle cx="1080" cy="191" r="5" fill="#ccc"/><text x="1092" y="195">IN1N</text>
    <circle cx="1080" cy="226" r="5" fill="#ccc"/><text x="1092" y="230">IN1P</text>
    <circle cx="1080" cy="261" r="5" fill="#ccc"/><text x="1092" y="265">IN2N</text>
    <circle cx="1080" cy="296" r="5" fill="#ccc"/><text x="1092" y="300">IN2P</text>
  </g>
  <g font-size="12" fill="#b9d9c2">
    <circle cx="1080" cy="331" r="5" fill="#ccc"/><text x="1092" y="335">GPIO1</text>
    <circle cx="1080" cy="366" r="5" fill="#ccc"/><text x="1092" y="370">GPIO2</text>
    <circle cx="1080" cy="401" r="5" fill="#ccc"/><text x="1092" y="405">GND</text>
    <circle cx="1080" cy="436" r="5" fill="#ccc"/><text x="1092" y="440">3V3</text>
  </g>
  <text x="1125" y="485" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">ADS1292</text>
  <text x="1125" y="505" text-anchor="middle" font-size="11" fill="#cfe8d6">左排针（从上到下）</text>

  <!-- 进阶方案 -->
  <rect x="610" y="565" width="575" height="160" rx="8" fill="#f4f8fd" stroke="#1f5fa8" stroke-dasharray="6 4"/>
  <text x="626" y="592" font-size="14" font-weight="bold" fill="#1f5fa8">进阶（可选）：把 RLD 移到骨头上</text>
  <text x="626" y="618" font-size="13" fill="#333">· 另买 1 根纽扣（按扣）导联线 + 1 片 Ag/AgCl 凝胶电极，</text>
  <text x="626" y="640" font-size="13" fill="#333">  贴在鹰嘴突（肘尖，手臂背面），导联线接 RLDOUT；</text>
  <text x="626" y="662" font-size="13" fill="#333">· 两块导联板的蓝线都不接，中间片只是贴在皮肤上、不起作用；</text>
  <text x="626" y="684" font-size="13" fill="#333">· 和默认接法各录一段静息，对比 50 Hz 噪声，噪声小的方案留用。</text>
  <text x="626" y="708" font-size="12" fill="#888">默认接法已经能用；只有静息噪声明显偏大时才需要改。</text>

  <!-- ================= 底部要点 ================= -->
  <rect x="20" y="755" width="1165" height="110" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="36" y="782" font-size="14" fill="#222"><tspan font-weight="bold">位置：</tspan>两块板的中心都在“肩峰—肘窝连线、肘窝往上 1/3”处，长头、短头各一块，左右至少留 1 cm 间隙；放不下时让短头那块略往下错开，不要往上挪到神经支配区。</text>
  <text x="36" y="810" font-size="14" fill="#222"><tspan font-weight="bold">方向：</tspan>板的长边顺着肌纤维（上下方向），IN-P 一端朝肩、IN-N 一端朝肘，两块板方向一致；贴前刮毛、酒精擦拭，用绑带或胶带压紧，导联线朝肘部引出并固定。</text>
  <text x="36" y="838" font-size="14" fill="#222"><tspan font-weight="bold">RLD：</tspan>中间片压在肌肉上也能工作（厂家就是这样设计的），只接板 1 的蓝线；板 2 的蓝线默认悬空，也可以并到 RLDOUT，按静息噪声决定。</text>
</svg>
